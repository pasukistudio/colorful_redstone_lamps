plugins {
    id 'com.gradleup.shadow' version '9.6.1'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}


repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.architectury.minecraft}"
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury 20.0.4 references BreakBlockEvent, which NeoForge 26.1 does not provide.
    // This local LGPL-compatible patch uses NeoForge 26.1's BlockEvent.BreakEvent instead.
    implementation files('libs/architectury-neoforge-20.0.4-26.1fix.jar')

    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

sourceSets.main.resources { srcDir project(':common').file('src/generated/resources').getAbsolutePath() }

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from zipTree(jar.archiveFile)
    // NeoForge discovers embedded dependencies through META-INF/jarjar/metadata.json.
    // Keep Architectury as a nested JAR so users only have to install this mod JAR.
    from('libs/architectury-neoforge-20.0.4-26.1fix.jar') {
        into 'META-INF/jarjar'
    }
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "mc${rootProject.minecraft_version}-neoforge"
}

jar {
    archiveClassifier = 'raw'
}

java {
    withSourcesJar()
}
